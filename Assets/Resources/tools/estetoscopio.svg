<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tubo principal -->
  <path d="M 30,30 Q 30,70 50,80 Q 70,70 70,30" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
  <!-- Tubo hacia la campana -->
  <line x1="50" y1="80" x2="50" y2="95" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
  <!-- Ojivas (auriculares) -->
  <circle cx="25" cy="25" r="6" fill="#7F8C8D"/>
  <circle cx="75" cy="25" r="6" fill="#7F8C8D"/>
  <!-- Metal de los auriculares -->
  <path d="M 25,25 Q 30,15 30,30 M 75,25 Q 70,15 70,30" fill="none" stroke="#95A5A6" stroke-width="4"/>
  <!-- Campana médica -->
  <circle cx="50" cy="95" r="10" fill="#BDC3C7" stroke="#7F8C8D" stroke-width="3"/>
  <circle cx="50" cy="95" r="4" fill="#95A5A6"/>
</svg>
