  <rect x="10" y="23" width="60" height="47" rx="5" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="4"/>
  <!-- Franja decorativa -->
  <rect x="12" y="55" width="56" height="5" fill="#E74C3C"/>
  <!-- Cruz roja lateral -->
  <rect x="35" y="32" width="6" height="16" rx="1" fill="#E74C3C"/>
  <rect x="30" y="37" width="16" height="6" rx="1" fill="#E74C3C"/>
  <!-- Llantas -->
  <circle cx="25" cy="75" r="12" fill="#2C3E50"/>
  <circle cx="25" cy="75" r="5" fill="#95A5A6"/>
  <circle cx="75" cy="75" r="12" fill="#2C3E50"/>
  <circle cx="75" cy="75" r="5" fill="#95A5A6"/>
</svg>
