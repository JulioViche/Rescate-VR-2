  <rect x="53" y="15" width="12" height="8" rx="3" fill="#3498DB"/>
  <!-- Cabina frontal -->
  <path d="M 60,25 L 85,35 V 70 H 60 Z" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2"/>
  <polygon points="65,30 80,38 80,50 65,50" fill="#81D4FA"/> <!-- Ventana -->
