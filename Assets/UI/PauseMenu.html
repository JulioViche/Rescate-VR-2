<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pause Menu - Rescate VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Chakra Petch', sans-serif;
        }
        .panel {
            background-color: #000000;
            border: 3px solid #00b4d8;
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.3);
            padding: 50px 80px;
            text-align: center;
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
        }
        .title {
            font-size: 55px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .t-primary { color: #edf2f4; }
        .t-accent { color: #ff0a54; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            color: #00b4d8;
            border: 3px solid #00b4d8;
            padding: 15px 30px;
            margin: 15px auto;
            width: 320px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #00b4d8; color: #0d1321; box-shadow: 0 0 15px #00b4d8; }
        .btn.accent {
            color: #ff0a54;
            border-color: #ff0a54;
            background-color: #000000;
        }
        .btn.accent:hover { background-color: #ff0a54; color: #fff; box-shadow: 0 0 15px #ff0a54; }
        .btn span { margin-left: 15px; }
        .icon { font-size: 24px; width: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title"><span class="t-primary">MENÚ DE </span><span class="t-accent">PAUSA</span></div>
        <div class="btn"><i class="icon fa-solid fa-play"></i> <span>REANUDAR</span></div>
        <div class="btn"><i class="icon fa-solid fa-rotate-right"></i> <span>REINICIAR</span></div>
        <div class="btn"><i class="icon fa-solid fa-gear"></i> <span>OPCIONES</span></div>
        <div class="btn accent"><i class="icon fa-solid fa-house-medical"></i> <span>MENÚ PRINCIPAL</span></div>
    </div>
</body>
</html>
