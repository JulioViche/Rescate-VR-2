<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Defeat Menu - Rescate VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            background-image: url('images/defeatbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        .dark-panel {
            text-align: center;
            color: #fff;
            padding: 80px;
            background: rgba(0, 0, 0, 0.35);
            border: 3px solid #ff0a54;
            box-shadow: 0 0 60px rgba(255, 10, 84, 0.15);
            border-radius: 20px;
        }

        .title-large {
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .t-white {
            color: #edf2f4;
        }

        .t-danger {
            color: #ff0a54;
            text-shadow: 0 0 20px rgba(255, 10, 84, 0.7);
        }

        /* Simulación de gráfica de ritmo cardíaco plana (Asistolia) */
        .ekg {
            margin: 40px auto;
            width: 800px;
            height: 30px;
            position: relative;
        }

        .ekg::after {
            content: "";
            position: absolute;
            top: 14px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ff0a54;
            box-shadow: 0 0 15px #ff0a54;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
        }

        .btn-outline {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            padding: 15px 35px;
            font-size: 22px;
            font-weight: 600;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-outline.danger {
            border: 3px solid #ff0a54;
            color: #ff0a54;
        }

        .btn-outline.danger:hover {
            background: #ff0a54;
            color: #000000;
            box-shadow: 0 0 20px #ff0a54;
        }

        .btn-outline.blue {
            border: 3px solid #00b4d8;
            color: #00b4d8;
        }

        .btn-outline.blue:hover {
            background: #00b4d8;
            color: #000000;
            box-shadow: 0 0 20px #00b4d8;
        }

        .icon {
            font-size: 24px;
            margin-right: 15px;
        }
    </style>
</head>

<body>
    <div class="dark-panel">
        <div class="title-large t-white">EL PACIENTE</div>
        <div class="title-large t-danger">HA FALLECIDO</div>

        <div class="ekg"></div>

        <div class="btn-row">
            <div class="btn-outline danger"><i class="icon fa-solid fa-heart-pulse"></i> <span>REINTENTAR RESCATE</span>
            </div>
            <div class="btn-outline blue"><i class="icon fa-solid fa-house-medical"></i> <span>REGRESAR AL MENÚ</span>
            </div>
        </div>
    </div>
</body>

</html>
