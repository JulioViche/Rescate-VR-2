<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Victory Menu - Rescate VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            background-image: url('images/successbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Chakra Petch', sans-serif;
        }
        .dark-panel {
            text-align: center;
            color: #fff;
            padding: 80px;
            background: rgba(0, 0, 0, 0.35);
            border: 3px solid #00f5d4;
            box-shadow: 0 0 60px rgba(0, 245, 212, 0.15);
            border-radius: 20px;
        }
        .title-large {
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .t-white { color: #edf2f4; }
        .t-success { 
            color: #00f5d4; 
            text-shadow: 0 0 20px rgba(0, 245, 212, 0.7); 
        }
        /* Simulación de gráfica de ritmo cardíaco viva */
        .ekg {
            margin: 40px auto;
            width: 800px;
            height: 50px;
            position: relative;
            background: transparent;
        }
        .ekg::before {
            content: "^v^v^v^v^v^v^v^";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #00f5d4;
            font-size: 45px;
            line-height: 50px;
            letter-spacing: 20px;
            text-shadow: 0 0 15px #00f5d4;
            overflow: hidden;
            white-space: nowrap;
        }
        .btn-row {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .btn-outline {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #00f5d4;
            border: 3px solid #00f5d4;
            padding: 15px 70px;
            font-size: 26px;
            font-weight: 600;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-outline:hover {
            background: #00f5d4;
            color: #000000;
            box-shadow: 0 0 25px #00f5d4;
        }
        .icon { font-size: 28px; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="dark-panel">
        <div class="title-large t-white">EL PACIENTE</div>
        <div class="title-large t-success">HA SOBREVIVIDO</div>
        
        <div class="ekg"></div>
        
        <div class="btn-row">
            <div class="btn-outline"><i class="icon fa-solid fa-truck-medical"></i> <span>CONTINUAR</span></div>
        </div>
    </div>
</body>
</html>
