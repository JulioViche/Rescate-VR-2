<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Options Menu - Rescate VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Chakra Petch', sans-serif;
        }
        .panel {
            background-color: #000000;
            border: 3px solid #00b4d8;
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.3);
            padding: 50px 80px;
            text-align: center;
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .t-primary { color: #edf2f4; }
        .t-accent { color: #ff0a54; }
        .slider-container {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .btn-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #000000;
            color: #00b4d8;
            border: 3px solid #00b4d8;
            padding: 10px 20px;
            width: 220px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            margin-right: 20px;
        }
        .btn-label span { margin-left: 10px; }
        .slider-bar {
            width: 300px;
            height: 30px;
            background: transparent;
            /* Espacio vacío reservado para que tú coloques los Sliders nativos de Unity */
        }
        
        .btn-center {
            display: flex; align-items: center; justify-content: center;
            margin: 40px auto 0 auto;
            width: 250px;
            background-color: #000000;
            color: #ff0a54; border: 3px solid #ff0a54;
            padding: 15px 30px; font-size: 22px; font-weight: 700;
            border-radius: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-center:hover { background-color: #ff0a54; color: #fff; box-shadow: 0 0 15px #ff0a54; }
        .btn-center span { margin-left: 15px; }
        .icon { font-size: 22px; width: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title"><span class="t-primary">MENÚ DE </span><span class="t-accent">OPCIONES</span></div>
        
        <div class="slider-container">
            <div class="btn-label"><i class="icon fa-solid fa-volume-high"></i> <span>VOLUMEN</span></div>
            <div class="slider-bar"></div>
        </div>
        <div class="slider-container">
            <div class="btn-label"><i class="icon fa-solid fa-crosshairs"></i> <span>SENSIBILIDAD</span></div>
            <div class="slider-bar"></div>
        </div>
        <div class="slider-container">
            <div class="btn-label"><i class="icon fa-solid fa-sun"></i> <span>BRILLO</span></div>
            <div class="slider-bar"></div>
        </div>

        <div class="btn-center"><i class="icon fa-solid fa-arrow-rotate-left"></i> <span>VOLVER</span></div>
    </div>
</body>
</html>
